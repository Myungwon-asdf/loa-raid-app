<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LOA RAID - 원정대 캐릭터 및 주간 레이드 관리</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="icon" href="/logo.png" type="image/png">
  
  <style>
    :root {
      --bg-dark: #080b11;
      --card-bg: #0f1523;
      --inner-bg: #090d16;
      --border-color: #1a2336;
      --text-muted: #64748b;
      --accent-yellow: #fbbf24;
      --accent-green: #10b981;
      --accent-blue: #2563eb;
    }

    body { 
      background-color: var(--bg-dark); 
      color: #f1f5f9; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px 24px;
    }

    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; color: #fbbf24; font-size: 1.8rem; font-weight: 900;
      flex-direction: column; gap: 10px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1;
    }
    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-stats {
      display: flex;
      align-items: center;
      background-color: #0d121f;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 20px;
      gap: 24px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .btn-header-action {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
    }
    .btn-api-refresh { background-color: #2563eb; color: #fff; }
    .btn-api-refresh:hover { background-color: #1d4ed8; color: #fff; }
    .btn-weekly-reset { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-weekly-reset:hover { background-color: #334155; color: #fff; }
    .btn-icon-only { background-color: #1e293b; color: #cbd5e1; padding: 7px 11px; border: 1px solid #334155; }

    .nav-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .owner-tabs .nav-link {
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 8px;
      background: transparent;
      margin-right: 4px;
      border: 1px solid transparent;
    }
    .owner-tabs .nav-link:hover { color: #f1f5f9; }
    .owner-tabs .nav-link.active {
      background-color: #f59e0b;
      color: #000000;
      font-weight: 800;
    }

    .sub-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #0d121f;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .btn-sub-tool {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      color: #94a3b8;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .btn-sub-tool.active {
      background-color: #1e293b;
      color: #ffffff;
    }
    .btn-add-char-orange {
      background-color: #d97706;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-input-wrapper {
      position: relative;
      width: 280px;
    }
    .search-input {
      background-color: #0d121f;
      border: 1px solid var(--border-color);
      color: #f1f5f9;
      border-radius: 20px;
      padding: 5px 14px 5px 34px;
      font-size: 0.82rem;
      width: 100%;
    }
    .search-input:focus {
      background-color: #0d121f;
      color: #fff;
      border-color: #2563eb;
      outline: none;
      box-shadow: none;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.8rem;
    }

    .character-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .character-card:hover { border-color: #2e3d5a; }
    .character-card.dragging { opacity: 0.4; border: 2px dashed #fbbf24; }
    .col-12.drag-over .character-card { border-color: #fbbf24; background-color: #162035; }

    .card-top-section { display: flex; align-items: stretch; cursor: grab; }
    .card-top-section:active { cursor: grabbing; }
    
    .char-profile-box {
      width: 116px; min-width: 116px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 8px 6px 8px 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .char-profile-img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      border-radius: 6px;
    }

    .card-info-wrapper {
      padding: 14px 16px; flex-grow: 1;
      display: flex; flex-direction: column; justify-content: space-between; min-width: 0;
    }

    .owner-badge {
      font-size: 0.68rem; font-weight: 700;
      background-color: #1e293b; color: #94a3b8;
      padding: 1px 5px; border-radius: 4px; margin-right: 4px; flex-shrink: 0;
    }
    
    .char-name-container { display: flex; align-items: center; min-width: 0; }
    .char-name {
      font-size: 1.05rem; font-weight: 800; color: #ffffff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-grow: 1; min-width: 0;
    }
    .char-sub-text {
      font-size: 0.75rem; color: #94a3b8; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    
    .card-bottom-section { padding: 0 16px 16px 16px; }

    .gem-box {
      background-color: var(--inner-bg);
      border: 1px solid #141c2e; border-radius: 8px;
      padding: 6px 10px; margin-top: 12px;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;
    }
    .gem-title { color: #a855f7; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .gem-detail { color: #cbd5e1; font-weight: 600; }

    .raid-section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; margin-bottom: 8px;
    }
    .raid-section-title { font-size: 0.72rem; color: #64748b; font-weight: 700; }
    .raid-status-count { font-size: 0.75rem; color: var(--accent-green); font-weight: 800; }

    .raid-tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .raid-tag-btn {
      font-size: 0.72rem; font-weight: 700; padding: 5px 9px;
      border-radius: 6px; border: 1px solid #1e293b; background-color: #090d16;
      color: #64748b; cursor: pointer; transition: all 0.15s;
    }
    .raid-tag-btn.active { background-color: #059669; border-color: #10b981; color: #ffffff; }

    .card-footer-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; padding-top: 6px; }
    .btn-card-icon {
      background: none; border: none; color: #64748b;
      font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0;
    }
    .btn-card-icon:hover { color: #cbd5e1; }

    .schedule-card {
      background-color: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 18px; margin-bottom: 16px;
    }
    .schedule-title { font-size: 1.1rem; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
    .schedule-badge { font-size: 0.75rem; background-color: #1e293b; color: #94a3b8; padding: 2px 8px; border-radius: 6px; }
    .char-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-right: 6px; margin-bottom: 6px; border: 1px solid #1a2336;
    }
    .char-chip.done { background-color: #064e3b; color: #34d399; border-color: #059669; }
    .char-chip.todo { background-color: #0f172a; color: #cbd5e1; border-color: #334155; }
    .char-chip-img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div>🔄 데이터를 불러오는 중입니다...</div>
    <div style="font-size: 1rem; color: #cbd5e1;">잠시만 기다려주세요.</div>
  </div>

  <div class="top-header">
    <div class="d-flex align-items-center gap-3">
      <img src="https://lh3.googleusercontent.com/d/1ssudEtNEewzfpkEhQPRwjf2Z9VOPI2_i" alt="로고" class="brand-logo" onerror="this.src='https://via.placeholder.com/42'">
      <div>
        <div class="brand-title">LOA RAID</div>
        <div class="brand-subtitle">원정대 캐릭터 및 주간 레이드 관리 시스템</div>
      </div>
    </div>

    <div class="header-stats">
      <div class="stat-item">
        <span class="stat-label">등록 캐릭터</span>
        <span class="stat-value text-white" id="statCharCount">0명</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">주간 레이드 클리어</span>
        <span class="stat-value text-success" id="statCompletedRaids">0 / 0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">평균 아이템 레벨</span>
        <span class="stat-value" style="color: var(--accent-yellow);" id="statAvgLevel">Lv.0.00</span>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn-header-action btn-api-refresh" onclick="refreshApiData()" id="refreshBtn">🔄 API 최신화</button>
      <button class="btn-header-action btn-weekly-reset" onclick="resetWeeklyRaids()">🧹 주간 초기화</button>
      <button class="btn-header-action btn-icon-only" onclick="openRaidManageModal()" title="레이드 관리">⚙️</button>
    </div>
  </div>

  <div class="nav-section">
    <ul class="nav owner-tabs" id="ownerTabs"></ul>

    <div class="sub-tools">
      <button class="btn-sub-tool active" id="btnTabChars" onclick="switchView('CHARS')">👥 캐릭터 현황</button>
      <button class="btn-sub-tool" id="btnTabSchedule" onclick="switchView('SCHEDULE')">📋 남은 레이드 요약</button>
      <button class="btn-add-char-orange" onclick="openAddCharacterModal()">+ 캐릭터 추가</button>
    </div>
  </div>

  <div class="filter-bar" id="filterBarView">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="캐릭터명 / 직업 검색..." oninput="renderDashboard()">
    </div>
  </div>

  <div class="row g-3" id="characterGrid">
    <div class="col-12 text-center py-5 text-muted">데이터를 불러오는 중입니다...</div>
  </div>

  <div id="scheduleView" style="display: none;">
    <div id="scheduleListContainer"></div>
  </div>

  <div class="modal fade" id="addCharacterModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">캐릭터 추가</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">소유자</label>
            <input type="text" class="form-control bg-secondary text-white border-0" id="newOwner" placeholder="예: 아리">
          </div>
          <div class="mb-3">
            <label class="form-label">캐릭터명</label>
            <div class="input-group">
              <input type="text" class="form-control bg-secondary text-white border-0" id="newCharName" placeholder="캐릭터명 입력">
              <button class="btn btn-outline-warning" type="button" onclick="checkApiForNewChar()">API 자동조회</button>
            </div>
          </div>
          <div id="apiCheckResult" class="small text-muted mb-2"></div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-warning" onclick="submitNewCharacter()">추가하기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="raidManageModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">⚙️ 레이드 마스터 목록 관리</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2 mb-3">
            <div class="col-md-3">
              <input type="text" class="form-control bg-secondary text-white border-0" id="newRaidGroup" placeholder="레이드군">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control bg-secondary text-white border-0" id="newRaidName" placeholder="표시명">
            </div>
            <div class="col-md-3">
              <input type="number" class="form-control bg-secondary text-white border-0" id="newRaidLevel" placeholder="입장 레벨">
            </div>
            <div class="col-md-2">
              <button class="btn btn-warning w-100" onclick="addNewRaidMaster()">추가</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
              <thead>
                <tr>
                  <th>레이드군</th>
                  <th>표시명</th>
                  <th>입장 레벨</th>
                  <th>삭제</th>
                </tr>
              </thead>
              <tbody id="raidManageTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
